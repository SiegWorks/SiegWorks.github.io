<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="VoiconおよびDCS Localizerのサポート情報を案内するページです。">
  <title>Support | SiegWorks</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <header class="site-header product-header">
    <a class="brand" href="../">SiegWorks</a>
  </header>
  <main>
    <section class="product-hero compact-product-hero">
      <div class="container">
        <a class="back-link" href="../">← Homeへ戻る</a>
        <div class="product-summary-row">
          <div>
            <h1>Support</h1>
            <p class="product-page-description">製品ごとのサポート情報をご案内します。</p>
          </div>
        </div>
      </div>
    </section>
    <section class="product-support-area">
      <div class="container support-product-grid">
        <section class="support-product-card">
          <h2>Voicon</h2>
          <a class="support-link" href="../voicon/">製品サポートページ</a>
          <span class="support-link disabled-link">最新版ダウンロード（準備中）</span>
          <span class="support-link disabled-link">不具合報告（準備中）</span>
          <span class="support-link disabled-link">その他（準備中）</span>
        </section>
        <section class="support-product-card">
          <h2>DCS Localizer</h2>
          <a class="support-link" href="../dcs-localizer/">製品サポートページ</a>
          <span class="support-link disabled-link">最新版ダウンロード（準備中）</span>
          <span class="support-link disabled-link">不具合報告（準備中）</span>
          <span class="support-link disabled-link">その他（準備中）</span>
        </section>
      </div>
    </section>
  </main>
  <footer class="site-footer">
    <div class="container footer-inner">
      <nav class="legal-links">
        <span>利用規約（準備中）</span>
        <span>プライバシーポリシー（準備中）</span>
        <span>特定商取引法に基づく表記（準備中）</span>
      </nav>
      <p>© 2026 SiegWorks. All rights reserved.</p>
    </div>
  </footer>
</body>
</html>
